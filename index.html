<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sqoop Merchant</title><style>body{font:17px system-ui;background:#0d1824;color:#e6edf4;margin:0;padding:8vw;max-width:900px}h1{font-size:clamp(36px,7vw,70px);margin-bottom:12px}p{line-height:1.6;color:#b9c8d6}textarea{box-sizing:border-box;width:100%;min-height:140px;background:#172637;color:white;border:1px solid #607589;border-radius:12px;padding:16px;font:inherit}button{background:#9cf3cb;color:#092417;border:0;border-radius:9px;padding:14px 22px;font:inherit;margin:18px 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172637;padding:20px;border-radius:12px}label{display:block;margin:25px 0 12px}small{color:#9cf3cb}</style><main><small>WORKING PROTOTYPE · Galuxium Nexus V2</small><h1>Sqoop Merchant</h1><p>Merchant subscription quotation. This starter demonstrates one workflow. Sponsor integrations are still pending. Use fictional examples only.</p><form id="demo"><label for="input">Enter stores, users and monthly orders</label><textarea id="input" required>{"stores": 2, "users": 4, "orders": 150}</textarea><button id="run">Run demo</button></form><pre id="result" role="status" aria-live="polite">Ready.</pre></main><script>document.getElementById('demo').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('run'),o=document.getElementById('result');b.disabled=true;o.textContent='Working…';try{const r=await fetch('/api/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:document.getElementById('input').value})});o.textContent=JSON.stringify(await r.json(),null,2)}catch(e){o.textContent='Could not reach the server. Try again.'}finally{b.disabled=false}})</script></html>
